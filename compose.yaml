services:
  mysql:
    image: mysql:8.4
    container_name: index-research-mysql
    environment:
      MYSQL_ROOT_PASSWORD: projectroot
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql_data:
